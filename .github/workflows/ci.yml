name: FastAPI CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Report Repository Changes
        run: python report_changes.py

      - name: Summarize Repository Changes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          report = json.loads(pathlib.Path("change_report.json").read_text(encoding="utf-8"))
          summary = report["summary"]

          lines = [
              "## Repository Change Summary",
              f"- Total files: {summary['total_files']}",
              f"- API files: {summary['api_files']}",
              f"- Non-API files: {summary['non_api_files']}",
              "",
              "### API Changes",
          ]
          if report["api_changes"]:
              lines.extend(
                  f"- {item['status']} {item['path']} (+{item['added_lines']} / -{item['deleted_lines']})"
                  for item in report["api_changes"]
              )
          else:
              lines.append("- None")

          lines.extend(["", "### Non-API Changes"])
          if report["non_api_changes"]:
              lines.extend(
                  f"- {item['status']} {item['path']} (+{item['added_lines']} / -{item['deleted_lines']})"
                  for item in report["non_api_changes"]
              )
          else:
              lines.append("- None")

          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Run Tests
        run: python -m pytest

      - name: Detect Controllers
        run: python detect_controllers.py

      - name: Extract Endpoints
        run: python extract_endpoints.py

      - name: Compare Endpoint Versions
        run: python compare_endpoints.py

      - name: Generate OpenAPI Spec
        run: python generate_openapi.py

      - name: Upload Generated Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openapi-artifacts
          path: |
            detected_controllers.json
            detected_endpoints.json
            endpoint_diff.json
            change_report.json
            openapi_generated.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set. Skipping deploy step."
            exit 0
          fi
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
